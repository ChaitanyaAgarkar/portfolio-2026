<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEEEEE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--ssr-head-start-->
    <title>Chaitanya Agarkar | Software Developer &amp; Full-Stack Engineer</title>
    <meta
      name="description"
      content="Explore the portfolio of Chaitanya Agarkar, a Software Developer specializing in React, TypeScript, Node.js, enterprise applications, scalable systems, and modern web experiences."
    />
    <!--ssr-head-end-->
    <style>
      html,
      body {
        background-color: #eeeeee;
        color: #111111;
      }
      html.dark,
      html.dark body {
        background-color: #0b0c10;
        color: #f4f4f6;
      }
    </style>
    <script>
      try {
        if (window.localStorage.getItem('ca_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#EEEEEE] text-[#111111] antialiased selection:bg-[#2060FF]/15 selection:text-[#111111]">
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
